# Default policy configuration.
#
# This is the explicit, configurable allowlist required by the assignment
# brief (Section 3.4): what the agent is permitted to do, at both the
# discovery stage and replay stage. Both stages call the same policy engine
# (src/guardrails/engine.py) so behavior is identical whichever path is
# running.

# Only these origins may be navigated to or acted on. Anything else is
# blocked outright, no matter what the LLM or a replayed artifact requests.
# Both hostnames are listed for each tenant because localhost and 127.0.0.1
# are different origins to a browser/policy check even though they resolve
# to the same machine -- whichever one Playwright or a test happens to use
# must be allowlisted explicitly, nothing is implicitly trusted.
allowed_origins:
  - "http://localhost:4478"   # Tenant A
  - "http://127.0.0.1:4478"   # Tenant A (loopback IP form)
  - "http://localhost:4479"   # Tenant B
  - "http://127.0.0.1:4479"   # Tenant B (loopback IP form)
  # MERIDIAN CORE. The adaptation target; a hosted origin rather than a
  # local one, which changes nothing about how it is enforced.
  - "https://web-sample.interface-hiring.com"

# Action types the agent is permitted to perform at all. Extending this list
# is a deliberate policy change, not something a run can talk its way into.
allowed_action_types:
  - navigate
  - click
  - type
  - select
  - read_text
  - screenshot
  - wait_for

# Route patterns considered "safe/reversible" -- read-only or non-mutating.
# These proceed without extra confirmation.
safe_route_patterns:
  - "/desk/login"
  - "/desk"
  - "/desk/search"
  - "/desk/member/*"
  - "/operations/login"
  - "/operations"
  - "/operations/search"
  - "/operations/member/*"
  # MERIDIAN: reading is safe. Every GET form page is safe too -- opening
  # the transfer screen changes nothing; posting from it is what counts,
  # and that is a separate route below.
  - "/signon"
  - "/menu"
  - "/members"
  - "/members/*"
  - "/members/*/transfer"
  - "/members/*/open-share"
  - "/members/*/update"
  - "/members/*/hold"
  - "/members/*/transfer/review"
  - "/members/*/open-share/review"
  - "/members/*/hold/review"

# Route patterns considered mutating (they change state -- e.g. opening an
# account). These require either an approved artifact or explicit
# confirmation before they may run unattended. See REPORT.md Section 6.
mutating_route_patterns:
  - "/desk/member/*/subaccount/*"
  - "/operations/member/*/subaccount/*"
  # MERIDIAN: an information update mutates the record but is reversible
  # by submitting the prior values again, so it does not warrant the
  # irreversible tier. Note it posts to its own URL with no review step,
  # unlike every other transaction on this target.
  - "/members/*/update"

# Route patterns considered irreversible/high-risk even among mutating
# actions. These are never auto-executed -- they always require either a
# reviewed+approved artifact version or route to human escalation.
irreversible_route_patterns:
  - "/desk/member/*/subaccount/confirm"
  - "/operations/member/*/subaccount/confirm"
  # MERIDIAN: the three posting endpoints. Money moves, an account comes
  # into existence, or a member loses access to their funds -- none of
  # which is undone by submitting a form again. The target agrees: its
  # own hold confirmation screen renders the words "IRREVERSIBLE ACTION".
  - "/members/*/transfer/post"
  - "/members/*/open-share/post"
  - "/members/*/hold/post"

# Hard ceilings, independent of what any single action allows.
limits:
  max_steps_per_run: 40
  max_run_duration_seconds: 300
  max_recovery_attempts_per_step: 2

# Field names that must never appear in artifacts, logs, or evidence in
# their raw form. The redactor masks these before anything is persisted.
sensitive_field_names:
  - password
  - supervisor_code
  - ssn
  - credentials

# Output field names holding regulated financial/PII data (member balances,
# names, account numbers, etc.). Unlike sensitive_field_names above (which
# covers *input* fields like passwords), these are *output* values the
# capability returns to its caller. The caller gets the real value -- that
# is the entire point of the capability -- but anything persisted to disk
# (evidence logs, result.json) is masked. Screenshots are not pixel-redacted
# (a documented cut, not an oversight -- see REPORT.md); this list covers
# every place text-based redaction is actually feasible.
sensitive_output_fields:
  - savings_balance
  - member_name
  - account_number
