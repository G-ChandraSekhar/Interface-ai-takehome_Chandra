<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capability Console — MERIDIAN CORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------------
     A control plane above a legacy host.

     Not a pastiche of MERIDIAN's navy-and-function-keys -- imitating the
     target would be a costume. Not a generic dashboard either. The visual
     idea is the tension the system itself embodies: a modern supervisory
     layer watching a 1980s console, so the type is contemporary and the
     data is monospaced, because every value on this page came off a
     fixed-width terminal screen.

     Colour carries the three-way result contract, which is the central
     idea of the whole system. Five states, five hues, used nowhere else.
     ------------------------------------------------------------------ */
  /* ------------------------------------------------------------------
     A supervisory console above a legacy host.

     Grounded in the target rather than in a look. MERIDIAN descends from
     IBM terminals, so the type is IBM Plex -- Sans for the interface, Mono
     for every value, because every value on this page came off a
     fixed-width screen. The ground is navy-black rather than neutral
     black, taken from MERIDIAN's own chrome.

     Colour carries the three-way result contract, which is the central
     idea of the system. AMBER IS RESERVED FOR THE HUMAN and appears
     nowhere else: in an automated system, a person is the warm thing.
     ------------------------------------------------------------------ */
  :root {
    --ink:        #0B1017;
    --surface:    #121A24;
    --surface-2:  #18222E;
    --line:       #26323F;
    --paper:      #E4EAF1;
    --muted:      #8394A7;
    --dim:        #5A6879;

    --success:    #4FB286;
    --outcome:    #E0A458;
    --recovered:  #6C9BCF;
    --failure:    #D96A6A;
    --escalated:  #B084CC;
    --denied:     #7C8AA0;

    --human:      #E8A33D;

    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  /* --- masthead ---------------------------------------------------- */
  header {
    border-bottom: 1px solid var(--line);
    padding: 18px 24px 14px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.015em;
    margin: 0;
  }
  .sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.04em;
  }
  .spacer { flex: 1; }

  /* Scope switch. The archive is not hidden -- superseded versions and runs
     against the original target are still evidence -- but the working set is
     what a reviewer should land on. */
  .scope { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .scope button {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 4px 10px; border: 0; cursor: pointer;
    background: none; color: var(--muted);
  }
  .scope button[aria-pressed="true"] { background: var(--surface-2); color: var(--paper); }
  .scope button:focus-visible { outline: 2px solid var(--recovered); outline-offset: -2px; }

  /* Status legend as a first-class object: the result taxonomy is the
     product's central claim, so it gets stated rather than inferred. */
  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .legend span {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend i {
    width: 8px; height: 8px; border-radius: 2px;
    display: inline-block;
    font-style: normal;
  }

  /* --- layout ------------------------------------------------------ */
  main {
    display: grid;
    grid-template-columns: minmax(300px, 380px) 1fr;
    height: calc(100vh - 62px);
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
    .pane-left { max-height: 50vh; }
  }

  .pane-left {
    border-right: 1px solid var(--line);
    overflow-y: auto;
  }
  .pane-right { overflow-y: auto; padding: 24px 28px 60px; }

  /* Measure. On a wide monitor an unconstrained detail pane stretches every
     card edge to edge, which puts a label and its value a hand-span apart and
     pushes the verdict off the right of the screen. Capped at a comfortable
     reading width and left-aligned, so the page looks the same on a laptop
     and a 27-inch display. */
  .detail { max-width: 1180px; }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    padding: 16px 20px 8px;
    display: flex;
    justify-content: space-between;
  }

  /* --- capability catalog ------------------------------------------ */
  .cap {
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    cursor: default;
  }
  .cap-name { font-weight: 500; font-size: 13px; }
  .cap-meta {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--dim);
    margin-top: 2px;
  }
  .pill {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.05em;
    padding: 1px 6px;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* --- run list ----------------------------------------------------
     Status is a left rule, not a badge. The question a reviewer scans
     for is "which of the outcomes was this", so it reads down the
     column as a stripe rather than needing to be found per row. */
  .run {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-left: 3px solid transparent;
    padding: 11px 20px 11px 17px;
    cursor: pointer;
    color: inherit;
    font: inherit;
    transition: background 90ms ease;
  }
  .run:hover { background: var(--surface); }
  .run.active { background: var(--surface-2); }
  .run:focus-visible { outline: 2px solid var(--recovered); outline-offset: -2px; }

  .run-top { display: flex; align-items: baseline; gap: 8px; }
  .run-cap {
    font-weight: 500;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .run-id {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    margin-top: 2px;
  }
  .run-status {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-left: auto;
    white-space: nowrap;
  }

  /* --- detail ------------------------------------------------------ */
  .detail-head { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 20px; }
  .detail-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  .detail-id { font-family: var(--mono); font-size: 11px; color: var(--dim); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin: 16px 0 24px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 11px 13px; }
  .card h4 {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--dim); margin: 0 0 6px; font-weight: 500;
  }
  .kv { font-family: var(--mono); font-size: 12px; }
  .kv div { display: flex; gap: 8px; padding: 1.5px 0; }
  .kv b { color: var(--muted); font-weight: 400; min-width: 92px; }
  .kv span { color: var(--paper); word-break: break-word; }

  h3 {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--dim); font-weight: 500;
    margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }

  /* --- the signature: escalation as a measured pause ----------------
     A run that stopped for ninety seconds because a person had to look
     at a screen and decide is not a slow run. The gap IS the evidence
     that a human was in the loop, so it's drawn to scale rather than
     reported as a field. */
  .esc {
    border: 1px solid var(--escalated);
    border-radius: 5px;
    background: rgba(176,132,204,0.06);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .esc-reason { font-size: 13px; margin-bottom: 12px; }
  .esc-thread { display: flex; align-items: stretch; gap: 12px; }
  .esc-rail { width: 2px; background: var(--escalated); border-radius: 1px; position: relative; }
  .esc-rail::before, .esc-rail::after {
    content: ''; position: absolute; left: -3px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--escalated);
  }
  .esc-rail::before { top: 0; }
  .esc-rail::after { bottom: 0; }
  .esc-steps { flex: 1; }
  .esc-step {
    font-family: var(--mono); font-size: 11px;
    display: flex; justify-content: space-between; gap: 12px;
  }
  .esc-step + .esc-step { margin-top: 6px; }
  .esc-step b { font-weight: 400; color: var(--muted); }
  .esc-gap {
    font-family: var(--mono); font-size: 11px; color: var(--escalated);
    padding: 8px 0; font-style: normal;
  }
  .esc-gap strong { font-size: 15px; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
  th {
    text-align: left; font-weight: 500; color: var(--dim); font-size: 9.5px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line);
  }
  td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); color: var(--paper); }
  td.tier1 { color: var(--success); }
  td.tierN { color: var(--outcome); }

  .events { max-height: 320px; overflow-y: auto; font-family: var(--mono); font-size: 11px; }
  .ev { display: flex; gap: 10px; padding: 2.5px 0; border-bottom: 1px solid rgba(42,52,65,0.5); }
  .ev time { color: var(--dim); white-space: nowrap; }
  .ev b { font-weight: 500; }

  .shots { display: flex; gap: 12px; flex-wrap: wrap; }
  .shots figure { margin: 0; width: 240px; }
  .shots img { width: 100%; border: 1px solid var(--line); border-radius: 4px; display: block; background: #fff; }
  .shots figcaption { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 5px; }

  .empty { color: var(--muted); font-size: 13px; padding: 40px 0; max-width: 42ch; }
  .empty b { color: var(--paper); display: block; margin-bottom: 6px; font-size: 15px; }

  .fail-box {
    border: 1px solid var(--failure); border-radius: 5px;
    background: rgba(217,106,106,0.06); padding: 12px 14px;
    font-family: var(--mono); font-size: 11.5px;
  }
  .out-box {
    border: 1px solid var(--outcome); border-radius: 5px;
    background: rgba(224,164,88,0.06); padding: 12px 14px;
  }

  /* --- chat -------------------------------------------------------
     A drawer rather than a third column: the chat is a way of DRIVING the
     system, and the run list is the record of what it did. Docking it beside
     the evidence keeps cause and effect on one screen -- ask for a balance,
     watch the run appear. */
  .chat-toggle {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 4px 10px; cursor: pointer;
    background: none; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px;
  }
  .chat-toggle[aria-pressed="true"] { background: var(--surface-2); color: var(--paper); }
  .chat-toggle:focus-visible { outline: 2px solid var(--recovered); outline-offset: 2px; }

  .chat {
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    height: calc(100vh - 62px);
    background: var(--surface);
  }
  .chat-log { flex: 1; overflow-y: auto; padding: 18px 18px 8px; }
  .msg { margin-bottom: 14px; font-size: 13.5px; line-height: 1.55; }
  .msg .who {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 3px;
  }
  .msg.user .body { color: var(--paper); }
  .msg.bot .body { color: var(--paper); white-space: pre-wrap; }

  .inv {
    margin-top: 8px; border-left: 2px solid var(--line);
    padding: 6px 0 6px 10px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .inv b { color: var(--paper); font-weight: 500; }
  .inv .st { text-transform: uppercase; letter-spacing: 0.05em; }

  .chat-input { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; gap: 8px; }
  .chat-input input {
    flex: 1; background: var(--ink); color: var(--paper);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 10px; font-family: var(--sans); font-size: 13px;
  }
  .chat-input input:focus { outline: none; border-color: var(--recovered); }
  .chat-input button {
    background: var(--surface-2); color: var(--paper);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 14px; cursor: pointer; font-family: var(--sans); font-size: 13px;
  }
  .chat-input button:disabled { opacity: 0.45; cursor: default; }

  /* A real control, not a sentence asking the person to type 'yes'. The
     confirmation has to be an action the interface takes, so that what runs
     is what was shown rather than what a model understood. */
  .confirm {
    margin-top: 10px; padding: 12px 14px;
    border: 1px solid var(--business); border-radius: 6px;
    background: color-mix(in oklab, var(--business) 7%, transparent);
  }
  .confirm .what {
    font-family: var(--mono); font-size: 11.5px; color: var(--paper);
    margin-bottom: 4px;
  }
  .confirm .detail {
    font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 10px;
  }
  .confirm .row { display: flex; gap: 8px; }
  .confirm button {
    font-family: var(--sans); font-size: 12.5px; padding: 6px 14px;
    border-radius: 4px; cursor: pointer; border: 1px solid var(--line);
  }
  .confirm .go { background: var(--business); border-color: var(--business); color: #1a1400; font-weight: 500; }
  .confirm .no { background: none; color: var(--muted); }
  .confirm button:disabled { opacity: 0.45; cursor: default; }

  .chat-hint {
    padding: 0 18px 14px; font-size: 12.5px; color: var(--muted); line-height: 1.5;
  }
  .chat-hint code {
    font-family: var(--mono); font-size: 11.5px; color: var(--paper);
    display: block; margin-top: 6px; cursor: pointer;
  }
  .chat-hint code:hover { color: var(--recovered); }

  /* --- run head ----------------------------------------------------- */
  .run-head { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; }
  .run-head h2 { margin:0; font-size:23px; font-weight:600; letter-spacing:-0.01em;
                 word-break:break-word; }
  .runid { font-family:var(--mono); font-size:11px; color:var(--dim); margin-top:3px; }

  .verdict { display:flex; align-items:center; gap:9px; flex:none; padding-top:6px; }
  .verdict-dot { width:9px; height:9px; border-radius:50%; background:var(--v);
                 box-shadow:0 0 0 4px color-mix(in oklab, var(--v) 18%, transparent); }
  .verdict-word { font-family:var(--mono); font-size:11.5px; letter-spacing:0.09em;
                  text-transform:uppercase; color:var(--v); }
  .verdict-meta { font-family:var(--mono); font-size:11px; color:var(--dim); }

  .banner { margin:18px 0 4px; padding:13px 16px; border-radius:7px;
            background:color-mix(in oklab, var(--v) 8%, transparent);
            border-left:2.5px solid var(--v); display:flex; flex-direction:column; gap:4px; }
  .banner b { font-family:var(--mono); font-size:11.5px; letter-spacing:0.06em; color:var(--v); }
  .banner .expected { font-family:var(--mono); font-size:11px; color:var(--dim); }

  /* --- in / out ------------------------------------------------------ */
  .io { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:22px 0 6px; }
  .io section { background:var(--surface); border:1px solid var(--line);
                border-radius:8px; padding:14px 16px; }
  .kv { display:flex; gap:12px; padding:3px 0; font-family:var(--mono); font-size:12px; }
  .kv span { color:var(--muted); min-width:96px; flex:none; }
  .kv b { font-weight:500; word-break:break-word; }
  .kv b.masked { color:var(--dim); letter-spacing:0.04em; }
  .none { color:var(--dim); font-size:12px; margin:2px 0 0; }

  /* --- THE SPINE ------------------------------------------------------
     The signature of this console. A run is a sequence, so it is drawn as
     one and read downward like a transaction journal. Steps are quiet;
     the things that interrupt a run -- a fallback, a recovery, a person
     taking the session -- are the only things allowed to break the line,
     because those are the moments the system exists to make visible. */
  .journal-wrap { display:grid; grid-template-columns:1fr minmax(210px, 290px);
                  gap:26px; align-items:start; margin-top:22px; }

  .spine { list-style:none; margin:6px 0 0; padding:0 0 0 22px; position:relative; }
  .spine::before { content:''; position:absolute; left:4px; top:6px; bottom:14px;
                   width:1px; background:var(--line); }

  .node { position:relative; padding:0 0 15px 0; }
  .node .mark { position:absolute; left:-22px; top:5px; width:9px; height:9px;
                border-radius:50%; background:var(--ink);
                border:1.5px solid var(--line); }
  .node .body { display:flex; flex-direction:column; gap:1px; }
  .node b { font-family:var(--mono); font-size:12px; font-weight:500; }
  .node .sub { font-family:var(--mono); font-size:10.5px; color:var(--dim); }
  .node .sub em { font-style:normal; color:var(--outcome); }

  .node.rescued .mark { border-color:var(--outcome); width:11px; height:11px; left:-23px; }
  .node.recovered .mark { border-color:var(--recovered); }

  /* A person is a BREAK in the line, not a row in it. */
  .node.human { padding:6px 0 18px 0; }
  .node.human .mark {
    left:-27px; top:2px; width:19px; height:19px; border-radius:50%;
    background:var(--ink); border:2px solid var(--human);
  }
  .node.human b { color:var(--human); font-size:12.5px; }
  .node.human .body { padding:9px 13px; border-radius:7px;
    background:color-mix(in oklab, var(--human) 7%, transparent);
    border-left:2px solid var(--human); }

  .node.end { padding-bottom:0; }
  .node.end .mark { background:var(--v); border-color:var(--v); width:11px; height:11px; left:-23px; }
  .node.end b { color:var(--v); letter-spacing:0.05em; text-transform:uppercase; font-size:11.5px; }

  .spine-note { font-size:12px; color:var(--dim); margin:10px 0 0; max-width:52ch; line-height:1.5; }

  /* --- evidence, beside the journal ---------------------------------- */
  .evidence { position:sticky; top:14px; }
  .evidence h4 { font-family:var(--mono); font-size:10px; letter-spacing:0.09em;
                 text-transform:uppercase; color:var(--muted); margin:16px 0 5px; }
  .shot { display:block; margin-bottom:11px; text-decoration:none; }
  .shot img { width:100%; border:1px solid var(--line); border-radius:6px;
              background:#c9c9c9; display:block; transition:border-color .15s; }
  .shot:hover img { border-color:var(--muted); }
  .shot span { display:block; font-family:var(--mono); font-size:10px;
               color:var(--dim); margin-top:4px; }
  .dom { display:block; font-family:var(--mono); font-size:10.5px; color:var(--recovered);
         text-decoration:none; padding:3px 0; border-bottom:1px solid var(--line); }
  .dom:hover { color:var(--paper); }

  /* --- collapsible capability rail ----------------------------------- */
  .caps-toggle { width:100%; background:none; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 18px; font-family:var(--mono); font-size:10px;
    letter-spacing:0.09em; text-transform:uppercase; color:var(--muted);
    border-bottom:1px solid var(--line); }
  .caps-toggle:hover { color:var(--paper); }
  .caps-toggle .chev { transition:transform .18s; }
  .caps-toggle[aria-expanded="true"] .chev { transform:rotate(90deg); }

  @media (max-width: 1100px) { .journal-wrap { grid-template-columns:1fr; } .io { grid-template-columns:1fr; } }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useEffect } = React;

const STATUS = {
  success:          { color: 'var(--success)',   label: 'success' },
  escalated:        { color: 'var(--escalated)', label: 'escalated' },
  recovered:        { color: 'var(--recovered)', label: 'recovered' },
  business_outcome: { color: 'var(--outcome)',   label: 'business outcome' },
  blocked:          { color: 'var(--outcome)',   label: 'blocked' },
  failure:          { color: 'var(--failure)',   label: 'failure' },
  denied:           { color: 'var(--denied)',    label: 'denied' },
  stuck:            { color: 'var(--failure)',   label: 'stuck' },
  unknown:          { color: 'var(--dim)',       label: 'unknown' },
};
const statusOf = s => STATUS[s] || STATUS.unknown;

const clock = ts => ts ? new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
const day   = ts => ts ? new Date(ts).toLocaleDateString([], {month:'short', day:'numeric'}) : '';
const dur   = ms => ms == null ? '—' : ms < 1000 ? ms + 'ms' : (ms/1000).toFixed(1) + 's';

// A replay names its artifact; a discovery run only has the goal it was
// given, which is a sentence rather than a title. Truncating at the first
// clause keeps the rail scannable -- the full text is in the detail pane
// and on hover.
const label = r => {
  const t = r.capability || r.run_id;
  if (r.kind !== 'discovery') return t;
  const first = t.split(/[.,]/)[0];
  return first.length > 46 ? first.slice(0, 46) + '…' : first;
};

function Legend() {
  return (
    <div className="legend">
      {['success','escalated','recovered','business_outcome','failure','denied'].map(k => (
        <span key={k}><i style={{background: statusOf(k).color}} />{statusOf(k).label}</span>
      ))}
    </div>
  );
}


function Detail({ runId }) {
  const [run, setRun] = useState(null);

  useEffect(() => {
    if (!runId) { setRun(null); return; }
    setRun(null);
    fetch('/runs/' + runId).then(r => r.json()).then(setRun).catch(() => setRun(false));
  }, [runId]);

  if (!runId) return (
    <div className="empty">
      <b>Pick a run.</b>
      Every discovery and replay writes an evidence bundle. This reads those
      bundles directly, so what you see here is the same trail an auditor
      would be handed.
    </div>
  );
  if (run === null) return <div className="empty">Reading evidence…</div>;
  if (run === false) return <div className="empty"><b>That run could not be read.</b>Its evidence directory may have been removed.</div>;

  const st = statusOf(run.status);
  const entries = o => Object.entries(o || {});

  // ---- Build the journal -------------------------------------------------
  // A run IS a sequence, so it is drawn as one. Steps come from telemetry;
  // the moments between them -- a recovery firing, a human taking the
  // session -- come from the event log, and are interleaved in time order.
  // Those interruptions are the whole point of the system, so they get to
  // interrupt the line rather than sit in a table somewhere else.
  const journal = [];
  (run.step_telemetry || []).forEach(t => {
    journal.push({
      kind: 'step',
      id: t.step_id,
      tier: t.resolved_tier,
      strategy: t.resolved_strategy,
      rescued: (t.resolved_tier || 1) > 1,
      recovered: !!t.recovery_applied,
    });
  });

  (run.escalations || []).forEach(e => {
    // Placed after the step it interrupted where we know it, else at the end.
    const at = journal.findIndex(j => j.kind === 'step' && j.id === e.step_id);
    const node = { kind: 'human', seconds: e.seconds_total, waited: e.seconds_until_taken, step: e.step_id };
    if (at >= 0) journal.splice(at + 1, 0, node); else journal.push(node);
  });

  journal.push({
    kind: 'end',
    status: run.status,
    label: run.outcome_code || (run.failure && run.failure.step_class) || run.status,
  });

  const domUrl = n => '/runs/' + run.run_id + '/dom/' + n;

  return (
    <div className="detail">
      <div className="run-head">
        <div>
          <h2>{run.capability || run.run_id}</h2>
          <div className="runid">{run.run_id}</div>
        </div>
        <div className="verdict" style={{ '--v': st.color }}>
          <span className="verdict-dot" />
          <span className="verdict-word">{st.label}</span>
          <span className="verdict-meta">
            {dur(run.duration_ms)}
            {run.escalations && run.escalations.length ? ' · human ' + run.escalations[0].seconds_total + 's' : ''}
          </span>
        </div>
      </div>

      {(run.outcome_message || (run.failure && run.failure.observed)) && (
        <div className="banner" style={{ '--v': st.color }}>
          <b>{run.outcome_code || (run.failure && run.failure.step_class)}</b>
          <span>{run.outcome_message || (run.failure && run.failure.observed)}</span>
          {run.failure && run.failure.expected && (
            <span className="expected">expected&nbsp;&nbsp;{run.failure.expected}</span>
          )}
        </div>
      )}

      <div className="io">
        <section>
          <h3>Sent in</h3>
          {entries(run.params).length === 0 && <p className="none">none</p>}
          {entries(run.params).map(([k, v]) => (
            <div className="kv" key={k}><span>{k}</span><b>{String(v)}</b></div>
          ))}
        </section>
        <section>
          <h3>Came back</h3>
          {entries(run.outputs).length === 0 && <p className="none">none</p>}
          {entries(run.outputs).map(([k, v]) => (
            <div className="kv" key={k}>
              <span>{k}</span>
              <b className={String(v).includes('REDACT') ? 'masked' : ''}>{String(v)}</b>
            </div>
          ))}
        </section>
      </div>

      {/* --- the journal, and its evidence, side by side ------------------ */}
      <div className="journal-wrap">
        <div>
          <h3>What happened</h3>
          <ol className="spine">
            {journal.map((j, i) => {
              if (j.kind === 'human') return (
                <li className="node human" key={i}>
                  <span className="mark" />
                  <div className="body">
                    <b>A person took the session</b>
                    <span className="sub">
                      {j.seconds}s in the loop
                      {j.waited != null ? ' · ' + j.waited + 's before control was taken' : ''}
                      {j.step ? ' · at ' + j.step : ''}
                    </span>
                    <span className="sub">
                      Replay paused here, then verified the resulting state rather
                      than trusting the outcome.
                    </span>
                  </div>
                </li>
              );
              if (j.kind === 'end') return (
                <li className={'node end ' + j.status} key={i} style={{ '--v': st.color }}>
                  <span className="mark" />
                  <div className="body"><b>{j.label}</b></div>
                </li>
              );
              return (
                <li className={'node step' + (j.rescued ? ' rescued' : '') + (j.recovered ? ' recovered' : '')} key={i}>
                  <span className="mark" />
                  <div className="body">
                    <b>{j.id}</b>
                    <span className="sub">
                      {j.strategy}
                      {j.rescued && <em> · fell back to tier {j.tier}</em>}
                      {j.recovered && <em> · recovered here</em>}
                    </span>
                  </div>
                </li>
              );
            })}
          </ol>
          {(run.step_telemetry || []).some(t => (t.resolved_tier || 1) > 1) ? (
            <p className="spine-note">
              A step that falls back still succeeds — and says so. That is drift
              showing up in the evidence before it becomes an outage.
            </p>
          ) : (
            <p className="spine-note">Every step resolved on its first candidate.</p>
          )}
        </div>

        <aside className="evidence">
          <h3>Evidence</h3>
          {(run.screenshots || []).map(s => (
            <a className="shot" key={s} href={'/runs/' + run.run_id + '/screenshots/' + s} target="_blank" rel="noreferrer">
              <img src={'/runs/' + run.run_id + '/screenshots/' + s} alt={s} loading="lazy" />
              <span>{s}</span>
            </a>
          ))}
          {(run.dom_snapshots || []).length > 0 && (
            <div className="doms">
              <h4>Page markup</h4>
              <p className="none">
                What the locator ladder was resolving against — useful when a
                step stops resolving and the screenshot looks normal.
              </p>
              {run.dom_snapshots.map(n => (
                <a className="dom" key={n} href={domUrl(n)} target="_blank" rel="noreferrer">{n}</a>
              ))}
            </div>
          )}
          {(run.screenshots || []).length === 0 && (run.dom_snapshots || []).length === 0 && (
            <p className="none">Nothing captured — this run had nothing to explain.</p>
          )}
        </aside>
      </div>

      {(run.step_telemetry || []).length > 0 && (
        <>
          <h3>Locator resolution</h3>
          <table className="tel">
            <thead><tr><th>Step</th><th>Tier</th><th>Strategy</th><th>Recovered</th></tr></thead>
            <tbody>
              {run.step_telemetry.map(t => (
                <tr key={t.step_id}>
                  <td>{t.step_id}</td>
                  <td className={(t.resolved_tier || 1) > 1 ? 'amber' : 'green'}>{t.resolved_tier}</td>
                  <td>{t.resolved_strategy}</td>
                  <td>{t.recovery_applied ? 'yes' : ''}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </>
      )}

      {run.events && (
        <>
          <h3>Event log · {run.events.length}</h3>
          <div className="events">
            {run.events.map((e,i) => (
              <div className="ev" key={i}>
                <time>{clock(e.ts)}</time>
                <b>{e.event}</b>
                <span style={{color:'var(--dim)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                  {e.step_id || e.reason || e.status || e.url || e.page_url || ''}
                </span>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}


const SCOPES = {
  meridian: { label: 'MERIDIAN', caps: '?target=meridian&latest_only=true', runs: '&target=meridian' },
  all:      { label: 'All',      caps: '',                                  runs: '' },
};


function Chat() {
  const [log, setLog] = useState([]);
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const [pending, setPending] = useState(null);

  const confirmAction = async () => {
    if (!pending || busy) return;
    setBusy(true);
    const token = pending.confirm_token;
    setPending(null);
    try {
      const res = await fetch('/chat/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ confirm_token: token }),
      });
      const data = await res.json();
      setLog(h => [...h, { role: 'assistant', content: data.reply, invocations: data.invocations }]);
    } catch (e) {
      setLog(h => [...h, { role: 'assistant', content: 'The confirmation failed: ' + e.message }]);
    }
    setBusy(false);
  };

  const send = async (message) => {
    const question = (message !== undefined ? message : text).trim();
    if (!question || busy) return;
    setText('');
    const history = [...log, { role: 'user', content: question }];
    setLog(history);
    setBusy(true);
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: history.map(m => ({ role: m.role, content: m.content })),
        }),
      });
      const data = await res.json();
      setLog(h => [...h, { role: 'assistant', content: data.reply, invocations: data.invocations }]);
      setPending(data.pending || null);
    } catch (e) {
      setLog(h => [...h, { role: 'assistant', content: 'The request failed: ' + e.message }]);
    }
    setBusy(false);
  };

  return (
    <div className="chat">
      <div className="section-label"><span>Ask</span><span>drives the same API</span></div>

      {log.length === 0 && (
        <div className="chat-hint">
          Requests become capability invocations. Every one appears in the run
          list with its evidence.
          <code onClick={() => send("What's the balance of share 100234-S0070?")}>
            What's the balance of share 100234-S0070?
          </code>
          <code onClick={() => send('Look up member 100987')}>
            Look up member 100987
          </code>
          <code onClick={() => send("Update member 100234's phone to 555-0199")}>
            Update member 100234's phone to 555-0199
          </code>
          <code onClick={() => send('Transfer $50 from 100234-S0070 to 100234-S0001-3')}>
            Transfer $50 from 100234-S0070 to 100234-S0001-3
          </code>
        </div>
      )}

      <div className="chat-log">
        {log.map((m, i) => (
          <div className={'msg ' + (m.role === 'user' ? 'user' : 'bot')} key={i}>
            <div className="who">{m.role === 'user' ? 'you' : 'console'}</div>
            <div className="body">{m.content}</div>
            {(m.invocations || []).map((inv, j) => (
              <div className="inv" key={j}>
                <b>{inv.capability}</b>{' '}
                <span className="st" style={{color: statusOf(inv.status).color}}>
                  {inv.status}
                </span>
                {inv.outputs && Object.entries(inv.outputs).map(([k, v]) => (
                  <div key={k}>{k}: <b>{String(v)}</b></div>
                ))}
                {inv.outcome_code && <div>{inv.outcome_code}</div>}
                {inv.failure_class && <div>{inv.failure_class}</div>}
                {inv.evidence && <div style={{color:'var(--dim)'}}>{inv.evidence}</div>}
              </div>
            ))}
          </div>
        ))}
        {pending && !busy && (
          <div className="confirm">
            <div className="what">{pending.capability}</div>
            <div className="detail">
              {Object.entries(pending.params).map(([k, v]) => k + ': ' + v).join('  ·  ')}
            </div>
            <div className="row">
              <button className="go" onClick={confirmAction}>Confirm and run</button>
              <button className="no" onClick={() => setPending(null)}>Cancel</button>
            </div>
          </div>
        )}
        {busy && <div className="msg bot"><div className="who">console</div>
          <div className="body" style={{color:'var(--muted)'}}>Running…</div></div>}
      </div>

      <div className="chat-input">
        <input
          value={text}
          placeholder="Ask for a balance, a member, a transfer…"
          onChange={e => setText(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') send(); }}
          disabled={busy}
        />
        <button onClick={() => send()} disabled={busy || !text.trim()}>Send</button>
      </div>
    </div>
  );
}

function App() {
  const [caps, setCaps] = useState([]);
  const [runs, setRuns] = useState([]);
  const [selected, setSelected] = useState(null);
  const [scope, setScope] = useState('meridian');
  const [chatOpen, setChatOpen] = useState(false);
  const [capsOpen, setCapsOpen] = useState(false);

  useEffect(() => {
    const s = SCOPES[scope];
    const load = () => {
      fetch('/capabilities' + s.caps).then(r => r.json()).then(d => setCaps(d.capabilities || []));
      fetch('/runs?limit=100' + s.runs).then(r => r.json()).then(d => setRuns(d.runs || []));
    };
    load();
    const t = setInterval(load, 5000);
    return () => clearInterval(t);
  }, [scope]);

  return (
    <>
      <header>
        <h1>Capability Console</h1>
        <span className="sub">{caps.length} capabilities · {runs.length} runs</span>
        <div className="scope">
          {Object.entries(SCOPES).map(([k,v]) => (
            <button key={k} aria-pressed={scope === k} onClick={() => { setScope(k); setSelected(null); }}>
              {v.label}
            </button>
          ))}
        </div>
        <span className="spacer" />
        <Legend />
        <button
          className="chat-toggle"
          aria-pressed={chatOpen}
          onClick={() => setChatOpen(o => !o)}
          style={{marginLeft: 14}}
        >
          Ask
        </button>
      </header>
      <main style={chatOpen ? {gridTemplateColumns: "minmax(280px, 340px) 1fr minmax(320px, 420px)"} : undefined}>
        <div className="pane-left">
          {/* Collapsed by default: you browse RUNS, and consult the catalog
              occasionally. Giving half the rail to a list nobody scrolls
              pushed the thing people came for below the fold. */}
          <button
            className="caps-toggle"
            aria-expanded={capsOpen}
            onClick={() => setCapsOpen(o => !o)}
          >
            <span><span className="chev">›</span>&nbsp;&nbsp;Capabilities</span>
            <span>{caps.length}</span>
          </button>
          {capsOpen && caps.map(c => (
            <div className="cap" key={c.artifact_id + c.version}>
              <div className="cap-name">{c.artifact_id} <span className="pill">v{c.version}</span></div>
              <div className="cap-meta">
                {Object.keys(c.function.parameters.properties).join(' · ') || 'no parameters'}
                {' → '}
                {Object.keys(c.output_schema).join(' · ')}
              </div>
            </div>
          ))}

          {capsOpen && caps.length === 0 && (
            <div style={{padding:'8px 20px 16px', color:'var(--muted)', fontSize:12.5}}>
              No capabilities recorded against this target yet.
            </div>
          )}

          <div className="section-label"><span>Runs</span><span>newest first</span></div>
          {runs.map(r => {
            const st = statusOf(r.status);
            return (
              <button
                className={'run' + (selected === r.run_id ? ' active' : '')}
                key={r.run_id}
                style={{borderLeftColor: st.color}}
                onClick={() => setSelected(r.run_id)}
              >
                <div className="run-top">
                  <span className="run-cap" title={r.capability || r.run_id}>
                    {label(r)}
                  </span>
                  <span className="run-status" style={{color: st.color}}>{st.label}</span>
                </div>
                <div className="run-id">{r.kind} · {clock(r.started_at)} · {dur(r.duration_ms)}
                  {r.escalations.length > 0 && ' · human ' + r.escalations[0].seconds_total + 's'}
                </div>
              </button>
            );
          })}
        </div>
        <div className="pane-right"><Detail runId={selected} /></div>
        {chatOpen && <Chat />}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
